name: Qwen backend validation
on:
  pull_request:
    branches: [v3.00]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: qwen-backend-${{ github.ref }}
  cancel-in-progress: false
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Java cancellation and lifecycle regressions
        run: bash tools/test-qwen-core.sh
      - name: Build-script syntax and patch hygiene
        run: |
          python3 -m py_compile tools/prepare-qwen-runtimes.py tools/patch-qwen-sherpa.py tools/download-qwen-test-models.py
          git diff --check
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install SDK and native dependencies
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          sudo apt-get update
          sudo apt-get install -y ninja-build glslc libvulkan-dev spirv-headers
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: .gradle/qwen-runtimes
          key: qwen-arm64-ndk28c-${{ hashFiles('tools/prepare-qwen-runtimes.py', 'tools/patch-qwen-sherpa.py', 'app/src/main/cpp/qwen/**') }}
      - name: Build isolated ONNX, GGUF CPU and GGUF Vulkan libraries
        run: python3 tools/prepare-qwen-runtimes.py --ndk "$ANDROID_HOME/ndk/28.2.13676358"
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: .gradle/qwen-runtimes
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Compile and package Android debug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - name: Verify APK contains all runtime libraries
        run: |
          python3 - <<'PY'
          import glob, zipfile
          apk = glob.glob('app/build/outputs/apk/debug/*.apk')[0]
          with zipfile.ZipFile(apk) as z:
              for name in ('onnx', 'gguf_cpu', 'gguf_vulkan'):
                  assert 'lib/arm64-v8a/librtranslator_qwen_' + name + '.so' in z.namelist(), name
              assert 'lib/arm64-v8a/libonnxruntime.so' in z.namelist()
              assert 'assets/qwen-runtime.properties' in z.namelist()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-android-build
          path: |
            app/build/outputs/apk/debug/*.apk
            .gradle/qwen-runtimes/runtime.json
          include-hidden-files: true
          retention-days: 7
  native-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/cache/restore@v4
        id: runtime-cache
        with:
          path: .gradle/qwen-host
          key: qwen-linux-${{ hashFiles('tools/prepare-qwen-runtimes.py', 'tools/patch-qwen-sherpa.py', 'app/src/main/cpp/qwen/**') }}
      - name: Build the production JNI sources for host CPU
        run: python3 tools/prepare-qwen-runtimes.py --host --output .gradle/qwen-host
      - uses: actions/cache/save@v4
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        with:
          path: .gradle/qwen-host
          key: ${{ steps.runtime-cache.outputs.cache-primary-key }}
      - name: Fetch verified test weights and fixtures
        id: fixtures
        run: python3 tools/download-qwen-test-models.py .gradle/qwen-smoke-models
      - name: GGUF real transcription, cancellation and reuse
        run: |
          set -o pipefail
          bash tools/test-qwen-native.sh gguf .gradle/qwen-smoke-models/Qwen3-ASR-0.6B-Q4_K_M.gguf .gradle/qwen-smoke-models/jfk.wav .gradle/qwen-smoke-models/zh.wav 2>&1 | tee gguf-smoke.log
      - name: ONNX real transcription, cancellation and reuse
        if: ${{ !cancelled() && steps.fixtures.outcome == 'success' }}
        run: |
          set -o pipefail
          bash tools/test-qwen-native.sh onnx .gradle/qwen-smoke-models/sherpa-onnx-qwen3-asr-0.6B-int8-2026-03-25 .gradle/qwen-smoke-models/jfk.wav .gradle/qwen-smoke-models/zh.wav 2>&1 | tee onnx-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qwen-native-evidence
          path: |
            .gradle/qwen-host/runtime.json
            .gradle/qwen-smoke-models/provenance.json
            *-smoke.log
          include-hidden-files: true
          retention-days: 7
