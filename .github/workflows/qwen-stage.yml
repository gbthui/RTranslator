name: Apply Qwen feature patch
on:
  push:
    branches: [feat/qwen-asr-cancellation]
    paths: [.github/workflows/qwen-stage.yml]
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'gbthui/RTranslator'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qwen-asr-cancellation
      - name: Verify and apply the exact tested source patch
        run: |
          python3 - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          root = pathlib.Path('tools/.qwen-stage')
          encoded = ''.join((root / ('part%d.b64' % i)).read_text().strip() for i in range(5))
          data = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == '41bf10430d0629ab8403ca8858e8177934a3ed40ae6cf8888f49a486acb562fc'
          patch = pathlib.Path('/tmp/qwen-feature.patch')
          patch.write_bytes(data)
          subprocess.run(['git', 'apply', '--check', '--index', str(patch)], check=True)
          subprocess.run(['git', 'apply', '--index', str(patch)], check=True)
          whisper = pathlib.Path('app/src/main/java/nie/translator/rtranslator/voice_translation/neural_networks/voice/WhisperRecognizer.java')
          whisper.write_text('\n'.join(line.rstrip() for line in whisper.read_text().splitlines()) + '\n')
          subprocess.run(['git', 'add', str(whisper)], check=True)
          PY
          git rm -r tools/.qwen-stage .github/workflows/qwen-stage.yml
          bash tools/test-qwen-core.sh
          git diff --cached --check
      - name: Commit implementation without changing the default branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: add cancellable Qwen ONNX and GGUF speech backends'
          git push origin HEAD:feat/qwen-asr-cancellation
